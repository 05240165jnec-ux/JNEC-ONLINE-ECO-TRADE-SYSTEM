<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations - Success Page</title>
    <link rel="stylesheet" href="../CSS/success-signup.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="success-page">
        <div class="success-content">
            <div class="success-icon">
                <svg class="checkmark" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20,6 9,17 4,12"></polyline>
                </svg>
            </div>
            <h1 class="congratulations-text">Congratulations!</h1>
            <p class="success-message">Your account has been successfully created.</p>
            <button class="next-button"  onclick="handleNext()">Next</button>        </div>
    </div>
    <script src="../Js/success-signup.js"></script>
</body>
</html>
