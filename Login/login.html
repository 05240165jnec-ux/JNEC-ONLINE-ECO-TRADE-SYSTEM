<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3/dist/phosphor.js"></script>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <!-- Background Image -->
    <div class="background-image"></div>
    
    <!-- Main Login Container -->
    <div class="login-wrapper">
        <div class="login-container">
            <!-- Logo/Header section -->
            <div class="header-logo">
                <img src="../images/logo.png" alt="Logo">
            </div>
            
            <h2>Log in</h2>
            <p class="login-subtitle">Log in using your official RUB Email</p>

            <!-- Login Form -->
            <form class="login-form">
                <!-- Username Input -->
                <div class="input-container">
                    <input type="text" id="username" placeholder=" " class="text-white">
                    <label for="username" class="floating-label">Username</label>
                </div>

                <!-- Password Input -->
                <div class="input-container">
                    <input type="password" id="password" placeholder=" " class="text-white">
                    <label for="password" class="floating-label">Password</label>
                </div>

                <!-- Login Button -->
                <button type="submit" class="action-button login-button">
                    Log in
                </button>
            </form>

            <!-- "or login with" divider -->
            <div class="divider">or</div>
<button class="action-button google-button" onclick="window.location.href='google-acc.html'">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" class="w-5 h-5">
    Continue with Google
</button>

            <!-- Sign up section -->
            <div class="signup-section">
                <p class="signup-text">Don't have an account?</p>
                <button class="action-button signup-button">
                    Create Account
                </button>
            </div>
        </div>
    </div>

    <script src="../Js/login.js"></script>
</body>
</html>
