<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity & Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="../css/book_item.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-white fixed-top top-main-navbar">
        <div class="container-fluid marketplace-nav-container">
            <a class="navbar-brand marketplace-nav-brand" href="#">
                <i class="bi bi-recycle fs-3 me-2 text-white"></i> 
                <span class="fs-4 fw-bold text-white">JNEC ONLINE ECO-TRADE</span>
            </a>

            <div class="d-flex align-items-center">
                <span class="me-3 d-none d-md-block text-white fw-medium welcome-message">Welcome, Yoesel! 👋</span>

                <a class="nav-link me-3 notification-icon-link" href="#">
                    <i class="bi bi-bell-fill fs-5"></i> 
                    <span class="badge rounded-pill bg-danger notification-badge">3</span>
                </a>
                
                <a class="nav-link d-none d-lg-block" href="#"><i class="bi bi-person-circle fs-5"></i> Profile</a>
            </div>
        </div>
    </nav>

    <div class="marketplace-wrapper">
        <aside class="left-sidebar">
            <div class="sidebar-header">
                <a href="../Html/index.html" class="back-arrow text-dark me-3"><i class="bi bi-arrow-left fs-4"></i></a>
                <h1 class="h4 marketplace-title">Your Activity</h1>
            </div>

            <div id="search-view" class="view" style="display: none;">
                <h2>Search Marketplace</h2>
                <input type="text" id="searchInput" placeholder="Search for items..." />
                <button id="searchBtn">Search</button>

                    <div id="searchResults"></div>
            </div>

            <nav class="sidebar-menu">
    <!-- ✅ NEW: Search Marketplace -->
                <div id="sidebar-search-container" class="sidebar-item search-bar-wrapper">
                    <input type="text" id="sidebarSearchInput" placeholder="Search Marketplace" class="marketplace-search-input-sidebar">
                </div>
                <a href="#" class="sidebar-item menu-item active" data-view="recent-activity">
                    <i class="bi bi-hourglass-split"></i> <span>Recent Activity</span>
                </a>
                <a href="#" class="sidebar-item menu-item" data-view="saved">
                    <i class="bi bi-bookmark-fill"></i> <span>Saved</span>
                </a>
                <a href="#" class="sidebar-item menu-item" data-view="alerts">
                    <i class="bi bi-bell-fill"></i> <span>Notification</span>
                </a>
            </nav>          

        </aside>

        <main class="main-content">
            <h2 class="section-title">Recent Activity</h2>
            <div class="browse-items-container" id="content-area">
                </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/book_item.js"></script>
</body>
</html>
