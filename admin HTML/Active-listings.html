<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Listings - Admin Dashboard</title>
    <link rel="stylesheet" href="../admin CSS/Active-listings.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="admin-profile">
                    <div class="admin-avatar">UN</div>
                    <div class="admin-info">
                        <div class="admin-name">Uygen Namgyel</div>
                        <div class="admin-role">Administrator</div>
                    </div>
                </div>
                <button class="back-btn" onclick="goBackToHome()">← Back to Home</button>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item" onclick="navigateToSection('items')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span>Manage Items</span>
                </div>
                
                <div class="nav-item active" onclick="navigateToSection('listings')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                    <span>Active Listings</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('category')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
                    </svg>
                    <span>Item Category</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('users')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span>Manage User</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('feedback')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/>
                    </svg>
                    <span>Feedback</span>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <h1 class="page-title">Active Listings</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search listings..." onkeyup="searchListings()">
                    </div>
                </div>
            </div>

            <!-- Statistics Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number">45</div>
                    <div class="stat-label">Active Listings</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">18</div>
                    <div class="stat-label">Inactive Listings</div>
                </div>
            </div>

            <!-- Active Listings Section -->
            <div class="listings-section">
                <h2 class="section-title">Active Listings</h2>
                <div class="listings-grid" id="activeListingsGrid">
                    <!-- Active listings will be loaded here -->
                </div>
            </div>

            <!-- Inactive Listings Section -->
            <div class="listings-section">
                <h2 class="section-title">Inactive Listings</h2>
                <div class="listings-grid" id="inactiveListingsGrid">
                    <!-- Inactive listings will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Listing Detail Modal -->
    <div class="modal" id="listingDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Listing Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Listing details will be loaded here -->
            </div>
        </div>
    </div>
    <script src="../admin JS/Active-listings.js"></script>
</body>
</html>
