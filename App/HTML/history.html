<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking and Upload History</title>

  <!-- Bootstrap for responsiveness (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/history.css">
</head>
<body>
  <div class="history-container">
    <!-- Back Arrow -->
    <div class="going_back"><i class="fa fa-arrow-left"></i></div>

    <div class="header text-center py-3">
      <h1>History</h1>
    </div>

    <!-- Booking History -->
    <div>
      <h2>Booking History</h2>
      <div class="item d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <img src="table-icon.png" alt="Table Icon" class="item-icon">
          <div class="details ms-3">
            <span class="fw-bold">Table</span><br>
            <span>Booked on 2025-03-05</span>
          </div>
        </div>
        <button class="btn btn-danger btn-sm">Cancel Booking</button>
      </div>

      <div class="item d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <img src="jacket-icon.png" alt="Leather Jacket Icon" class="item-icon">
          <div class="details ms-3">
            <span class="fw-bold">Leather Jacket</span><br>
            <span>Booked on 2025-01-15</span>
          </div>
        </div>
        <button class="btn btn-danger btn-sm">Cancel Booking</button>
      </div>
    </div><br>

    <!-- Upload Item List -->
    <div>
      <h2>Upload Item List</h2>
      <div class="item d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <img src="handbag-icon.png" alt="Handbag Icon" class="item-icon">
          <div class="details ms-3">
            <span class="fw-bold">Handbag</span><br>
            <span>Uploaded on 2025-02-20</span>
          </div>
        </div>
        <div>
          <button class="btn btn-success btn-sm me-2">Edit</button>
          <button class="btn btn-danger btn-sm">Delete</button>
        </div>
      </div>

      <div class="item d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <img src="football-icon.png" alt="Football Icon" class="item-icon">
          <div class="details ms-3">
            <span class="fw-bold">Football</span><br>
            <span>Uploaded on 2025-01-10</span>
          </div>
        </div>
        <div>
          <button class="btn btn-success btn-sm me-2">Edit</button>
          <button class="btn btn-danger btn-sm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="../js/history.js"></script>
</body>
</html>
