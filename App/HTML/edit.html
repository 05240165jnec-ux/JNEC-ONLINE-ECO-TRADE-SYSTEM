<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .password-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            position: relative;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #6c757d;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 10;
        }
        .back-button:hover {
            color: #0d6efd;
        }
        .password-header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            padding-top: 10px;
        }
        .password-icon {
            font-size: 2.5rem;
            color: #0d6efd;
            margin-bottom: 15px;
        }
        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
        }
        .password-input-group {
            position: relative;
        }
        .btn-save {
            width: 100%;
            padding: 10px;
            font-weight: 600;
            margin-top: 10px;
        }
        .validation-summary {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
        }
        .requirement {
            margin-bottom: 5px;
            display: none;
        }
        .requirement.unmet {
            display: block;
        }
        .requirement.unmet i {
            color: #dc3545;
            margin-right: 5px;
        }
        .alert {
            margin-top: 15px;
        }
        .password-match {
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
        .password-match.error {
            color: #dc3545;
            display: block;
        }
        .password-match.success {
            color: #198754;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="password-container">
            <!-- Back arrow button -->
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="password-header">
                <div class="password-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h2>Edit Password</h2>
                <p class="text-muted">Change your password to keep your account secure</p>
            </div>
            
            <form id="passwordForm">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <div class="password-input-group">
                        <input type="password" class="form-control" id="currentPassword" required>
                        <button type="button" class="password-toggle" data-target="currentPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <div class="password-input-group">
                        <input type="password" class="form-control" id="newPassword" required>
                        <button type="button" class="password-toggle" data-target="newPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <!-- Validation summary - only shows unmet requirements -->
                    <div class="validation-summary" id="validationSummary">
                        <div class="requirement" id="lengthReq"><i class="fas fa-times"></i> At least 8 characters</div>
                        <div class="requirement" id="uppercaseReq"><i class="fas fa-times"></i> At least one uppercase letter</div>
                        <div class="requirement" id="lowercaseReq"><i class="fas fa-times"></i> At least one lowercase letter</div>
                        <div class="requirement" id="numberReq"><i class="fas fa-times"></i> At least one number</div>
                        <div class="requirement" id="specialReq"><i class="fas fa-times"></i> At least one special character</div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <div class="password-input-group">
                        <input type="password" class="form-control" id="confirmPassword" required>
                        <button type="button" class="password-toggle" data-target="confirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-match" id="passwordMatch"></div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-save">Save</button>
            </form>
            
            <div id="alertContainer"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Back button functionality
            const backButton = document.getElementById('backButton');
            backButton.addEventListener('click', function() {
                if (confirm('Are you sure you want to go back? Any unsaved changes will be lost.')) {
                    // In a real app, this would navigate to the previous page
                    alert('Navigating back...');
                    // window.history.back(); // Uncomment for actual back navigation
                }
            });
            
            // Password toggle functionality
            const toggleButtons = document.querySelectorAll('.password-toggle');
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const passwordInput = document.getElementById(targetId);
                    const icon = this.querySelector('i');
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            });
            
            // Password validation
            const newPasswordInput = document.getElementById('newPassword');
            const validationSummary = document.getElementById('validationSummary');
            const requirements = {
                length: document.getElementById('lengthReq'),
                uppercase: document.getElementById('uppercaseReq'),
                lowercase: document.getElementById('lowercaseReq'),
                number: document.getElementById('numberReq'),
                special: document.getElementById('specialReq')
            };
            
            // Track if user is currently typing
            let typingTimer;
            const doneTypingInterval = 1000; // 1 second after user stops typing
            
            newPasswordInput.addEventListener('input', function() {
                // Clear the previous timer
                clearTimeout(typingTimer);
                
                // Hide validation summary while typing
                validationSummary.style.display = 'none';
                
                // Set a new timer
                typingTimer = setTimeout(checkPasswordRequirements, doneTypingInterval);
                
                // Check password match in real-time
                checkPasswordMatch();
            });
            
            // Also check when user leaves the field
            newPasswordInput.addEventListener('blur', function() {
                checkPasswordRequirements();
            });
            
            function checkPasswordRequirements() {
                const password = newPasswordInput.value;
                
                // Don't show validation if field is empty
                if (password.length === 0) {
                    validationSummary.style.display = 'none';
                    return;
                }
                
                // Check each requirement
                const hasLength = password.length >= 8;
                const hasUppercase = /[A-Z]/.test(password);
                const hasLowercase = /[a-z]/.test(password);
                const hasNumber = /[0-9]/.test(password);
                const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
                
                // Show unmet requirements only
                updateRequirement(requirements.length, hasLength);
                updateRequirement(requirements.uppercase, hasUppercase);
                updateRequirement(requirements.lowercase, hasLowercase);
                updateRequirement(requirements.number, hasNumber);
                updateRequirement(requirements.special, hasSpecial);
                
                // Check if there are any unmet requirements
                const hasUnmetRequirements = !hasLength || !hasUppercase || !hasLowercase || !hasNumber || !hasSpecial;
                
                // Show validation summary only if there are unmet requirements
                if (hasUnmetRequirements) {
                    validationSummary.style.display = 'block';
                } else {
                    validationSummary.style.display = 'none';
                }
            }
            
            // Confirm password match checker
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordMatchIndicator = document.getElementById('passwordMatch');
            
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            
            function checkPasswordMatch() {
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (confirmPassword === '') {
                    passwordMatchIndicator.textContent = '';
                    passwordMatchIndicator.className = 'password-match';
                } else if (newPassword === confirmPassword) {
                    passwordMatchIndicator.innerHTML = '<i class="fas fa-check"></i> Passwords match';
                    passwordMatchIndicator.className = 'password-match success';
                } else {
                    passwordMatchIndicator.innerHTML = '<i class="fas fa-times"></i> Passwords do not match';
                    passwordMatchIndicator.className = 'password-match error';
                }
            }
            
            function updateRequirement(element, condition) {
                if (condition) {
                    element.classList.remove('unmet');
                } else {
                    element.classList.add('unmet');
                }
            }
            
            // Form submission
            const passwordForm = document.getElementById('passwordForm');
            const alertContainer = document.getElementById('alertContainer');
            
            passwordForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Clear previous alerts
                alertContainer.innerHTML = '';
                
                // Validate form
                if (!currentPassword) {
                    showAlert('Please enter your current password.', 'danger');
                    return;
                }
                
                if (!newPassword) {
                    showAlert('Please enter a new password.', 'danger');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    showAlert('New passwords do not match.', 'danger');
                    return;
                }
                
                // Check password requirements
                const hasLength = newPassword.length >= 8;
                const hasUppercase = /[A-Z]/.test(newPassword);
                const hasLowercase = /[a-z]/.test(newPassword);
                const hasNumber = /[0-9]/.test(newPassword);
                const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(newPassword);
                
                if (!hasLength || !hasUppercase || !hasLowercase || !hasNumber || !hasSpecial) {
                    // Force showing the validation summary
                    checkPasswordRequirements();
                    showAlert('Please make sure your password meets all requirements.', 'warning');
                    return;
                }
                
                // Simulate successful password change
                showAlert('Password changed successfully!', 'success');
                
                // Reset form
                passwordForm.reset();
                passwordMatchIndicator.textContent = '';
                passwordMatchIndicator.className = 'password-match';
                validationSummary.style.display = 'none';
                
                // Reset requirement indicators
                Object.values(requirements).forEach(req => {
                    req.classList.remove('unmet');
                });
            });
            
            function showAlert(message, type) {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                alertContainer.appendChild(alertDiv);
                
                // Auto-dismiss after 5 seconds
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.remove();
                    }
                }, 5000);
            }
        });
    </script>
</body>
</html>
