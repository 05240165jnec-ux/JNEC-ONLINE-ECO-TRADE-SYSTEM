<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/contact_us.css" />
</head>
<body>
  <div class="container my-5">
    <div class="contact-card p-4 rounded">
      <button class="btn btn-link p-0 mb-3 back-btn"><- Back</button>
      <h5 class="text-center fw-bold mb-4">Contact Us</h5>

      <h2 class="fw-bold mb-3">We're here to help</h2>
      <p>If you have any questions or need assistance, please reach out to us using the options below.</p>

      <div class="contact-info bg-secondary bg-opacity-25 p-3 rounded mt-4">
        <div class="d-flex justify-content-between py-2 border-bottom">
          <div>Email</div>
          <div id="email">loading...</div>
        </div>
        <div class="d-flex justify-content-between py-2 border-bottom">
          <div>Phone</div>
          <div id="phone">loading...</div>
        </div>
        <div class="d-flex justify-content-between py-2">
          <div>Address</div>
          <div id="address">loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/contact.js"></script>
</body>
</html>
