<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Category - Admin Dashboard</title>
    <link rel="stylesheet" href="../admin CSS/Item-category.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="admin-profile">
                    <div class="admin-avatar">UN</div>
                    <div class="admin-info">
                        <div class="admin-name">Uygen Namgyel</div>
                        <div class="admin-role">Administrator</div>
                    </div>
                </div>
                <button class="back-btn" onclick="goBackToHome()">← Back to Home</button>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item" onclick="navigateToSection('items')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span>Manage Items</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('listings')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                    <span>Active Listings</span>
                </div>
                
                <div class="nav-item active" onclick="navigateToSection('category')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
                    </svg>
                    <span>Item Category</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('users')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span>Manage User</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('feedback')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/>
                    </svg>
                    <span>Feedback</span>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <h1 class="page-title">Item Categories</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search categories..." onkeyup="searchCategories()">
                    </div>
                    <button class="add-category-btn" onclick="openAddCategoryModal()">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                        Add Category
                    </button>
                </div>
            </div>

            <!-- Statistics Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="activeCategoriesCount">0</div>
                    <div class="stat-label">Active Categories</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalItemsCount">0</div>
                    <div class="stat-label">Total Items</div>
                </div>
            </div>

            <!-- Active Categories Section -->
            <div class="categories-section">
                <h2 class="section-title">Active Categories</h2>
                <div class="categories-grid" id="activeCategoriesGrid">
                    <!-- Active categories will be loaded here -->
                </div>
            </div>

            <!-- Inactive Categories Section -->
            <div class="categories-section">
                <h2 class="section-title">Inactive Categories</h2>
                <div class="categories-grid" id="inactiveCategoriesGrid">
                    <!-- Inactive categories will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Category Detail Modal -->
    <div class="modal" id="categoryDetailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Category Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Category details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal" id="addCategoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add New Category</h2>
                <button class="modal-close" onclick="closeAddCategoryModal()">&times;</button>
            </div>
            <div id="addCategoryBody">
                <form id="addCategoryForm" onsubmit="addNewCategory(event)">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="categoryName" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--gray-700);">Category Name</label>
                        <input type="text" id="categoryName" required style="width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: 8px; font-size: 14px; transition: all 0.3s ease;">
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="categoryDescription" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--gray-700);">Description</label>
                        <textarea id="categoryDescription" rows="3" style="width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: 8px; font-size: 14px; transition: all 0.3s ease; resize: vertical;"></textarea>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="categoryIcon" style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--gray-700);">Icon</label>
                        <select id="categoryIcon" style="width: 100%; padding: 0.75rem; border: 2px solid var(--gray-200); border-radius: 8px; font-size: 14px; transition: all 0.3s ease;">
                            <option value="📚">📚 Books</option>
                            <option value="👕">👕 Clothing</option>
                            <option value="💻">💻 Electronics</option>
                            <option value="⚽">⚽ Sports</option>
                            <option value="🛋️">🛋️ Furniture</option>
                            <option value="🔧">🔧 Tools</option>
                            <option value="🎨">🎨 Art Supplies</option>
                            <option value="🍳">🍳 Kitchen</option>
                        </select>
                    </div>
                    
                    <div class="modal-actions">
                        <button type="button" class="modal-btn btn-deactivate" onclick="closeAddCategoryModal()">Cancel</button>
                        <button type="submit" class="modal-btn btn-edit">Add Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../admin JS/Item-category.js"></script>
</body>
</html>
