<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Admin Dashboard</title>
    <link rel="stylesheet" href="../admin CSS/feedback.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="admin-profile">
                    <div class="admin-avatar">UN</div>
                    <div class="admin-info">
                        <div class="admin-name">Uygen Namgyel</div>
                        <div class="admin-role">Administrator</div>
                    </div>
                </div>
                <button class="back-btn" onclick="goBackToHome()">← Back to Home</button>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item" onclick="navigateToSection('items')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span>Manage Items</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('listings')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                    <span>Active Listings</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('category')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
                    </svg>
                    <span>Item Category</span>
                </div>
                
                <div class="nav-item" onclick="navigateToSection('users')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span>Manage Users</span>
                </div>
                
                <div class="nav-item active" onclick="navigateToSection('feedback')">
                    <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/>
                    </svg>
                    <span>Feedback</span>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <h1 class="page-title">Feedback & Reviews</h1>
                <div class="header-actions">
                    <div class="search-box">
                        <svg class="search-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                        <input type="text" class="search-input" placeholder="Search reviews..." onkeyup="searchReviews()">
                    </div>
                </div>
            </div>

            <!-- Statistics Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="totalReviews">0</div>
                    <div class="stat-label">Total Reviews</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="averageRating">0.0</div>
                    <div class="stat-label">Average Rating</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="positiveReviews">0</div>
                    <div class="stat-label">Positive (4-5★)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="recentReviews">0</div>
                    <div class="stat-label">This Month</div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterReviews('all')">All Reviews</button>
                <button class="filter-tab" onclick="filterReviews('positive')">Positive (4-5★)</button>
                <button class="filter-tab" onclick="filterReviews('neutral')">Neutral (3★)</button>
                <button class="filter-tab" onclick="filterReviews('negative')">Negative (1-2★)</button>
            </div>

            <!-- Feedback Layout -->
            <div class="feedback-layout">
                <!-- Rating Summary -->
                <div class="rating-summary">
                    <div class="overall-rating">
                        <div class="rating-number" id="overallRating">4.5</div>
                        <div class="rating-stars" id="overallStars">★★★★☆</div>
                        <div class="rating-count" id="totalReviewsCount">120 reviews</div>
                    </div>
                    
                    <div class="rating-breakdown">
                        <div class="rating-row">
                            <span class="rating-label">5★</span>
                            <div class="rating-bar">
                                <div class="rating-fill" style="width: 50%"></div>
                            </div>
                            <span class="rating-percentage">50%</span>
                        </div>
                        <div class="rating-row">
                            <span class="rating-label">4★</span>
                            <div class="rating-bar">
                                <div class="rating-fill" style="width: 30%"></div>
                            </div>
                            <span class="rating-percentage">30%</span>
                        </div>
                        <div class="rating-row">
                            <span class="rating-label">3★</span>
                            <div class="rating-bar">
                                <div class="rating-fill" style="width: 10%"></div>
                            </div>
                            <span class="rating-percentage">10%</span>
                        </div>
                        <div class="rating-row">
                            <span class="rating-label">2★</span>
                            <div class="rating-bar">
                                <div class="rating-fill" style="width: 5%"></div>
                            </div>
                            <span class="rating-percentage">5%</span>
                        </div>
                        <div class="rating-row">
                            <span class="rating-label">1★</span>
                            <div class="rating-bar">
                                <div class="rating-fill" style="width: 5%"></div>
                            </div>
                            <span class="rating-percentage">5%</span>
                        </div>
                    </div>
                </div>

                <!-- Reviews Section -->
                <div class="reviews-section">
                    <h2 class="section-title">Recent Reviews</h2>
                    <div class="reviews-list" id="reviewsList">
                        <!-- Reviews will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../admin JS/feedback.js"></script>
</body>
</html>
