<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Second Hand Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="logo">
            <i class="bi bi-recycle fs-3 me-2 text-white"></i>
            <span>JNEC ONLINE ECO-TRADE</span>
        </div>
        <div class="user-profile">
            <span>Welcome, Yoesel 👋</span>
            <div class="notification-icon">
                <i class="bi bi-bell-fill"></i>
                <span class="notification-badge">3</span>
            </div>
            <a href="#" class="profile-link">
                <i class="bi bi-person-circle"></i>
                <span>Profile</span>
            </a>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../Html/index.html" class="back-arrow text-dark me-3"><i class="bi bi-arrow-left fs-4"></i></a>
                <h2>User Activity</h2>
            </div>
            
            <div class="sidebar-menu-group sidebar-user-menu">
                <div class="menu-title">
                    User Menu
                    <i class="bi bi-chevron-down"></i>
                </div>
                <a href="history.html" class="category-link active">
                    <i class="bi bi-clock-history"></i>
                    <span>History</span>
                </a>
                <a href="feedback.html" class="category-link">
                    <i class="bi bi-chat-left-text"></i>
                    <span>Feedback</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1><i class="bi bi-clock-history"></i> Your History</h1>
                <p>Track your browsing and contact history</p>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="tab-btn active" data-filter="all">All Activity</button>
                <button class="tab-btn" data-filter="viewed">Viewed Items</button>
                <button class="tab-btn" data-filter="contacted">Contacted Sellers</button>
            </div>

            <!-- History Timeline -->
            <div class="history-timeline" id="historyTimeline">
                <!-- Items will be loaded by JavaScript -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="bi bi-inbox"></i>
                <h3>No History Yet</h3>
                <p>Your browsing and contact history will appear here</p>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.32/sweetalert2.all.min.js"></script>
    <script src="../js/history.js"></script>
</body>
</html>
